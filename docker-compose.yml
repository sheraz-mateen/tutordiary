services:
  postgres:
    image: postgres:17
    container_name: tutordiary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutordiary
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set, copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, copy .env.example to .env}
    ports:
      - "5433:5432"
    volumes:
      - tutordiary-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tutordiary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tutordiary-postgres-data:
